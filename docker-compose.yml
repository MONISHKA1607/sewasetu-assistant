services:
  db:
    image: postgres:15
    ports:
      - "127.0.0.1:5433:5432"   # localhost only, so tests/smoke_officer.py can read the DB
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  mcp-citizen:
    build:
      context: .
      dockerfile: mcp_service/Dockerfile
    command: ["python", "citizen_server.py"]
    ports:
      - "8101:8101"          # local testing; in production only the HTTPS proxy is exposed
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORT: "8101"
    depends_on:
      - db
      - app
    volumes:
      - uploads:/var/sewasetu/uploads:ro

  mcp-officer:
    build:
      context: .
      dockerfile: mcp_service/Dockerfile
    command: ["python", "officer_server.py"]
    ports:
      - "8102:8102"          # local testing; in production only the HTTPS proxy is exposed
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORT: "8102"
    depends_on:
      - db
      - app

  evals:
    # not started by default; run on demand:  docker compose ... --profile evals run --rm evals
    profiles: ["evals"]
    build:
      context: .
      dockerfile: mcp_service/Dockerfile
    working_dir: /app
    command: ["python", "evals/run_evals.py"]
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_URL: http://app:8000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
    depends_on:
      - app
      - mcp-citizen
      - mcp-officer
    volumes:
      - ./evals:/app/evals:ro
      - ./tests:/app/tests:ro
      - uploads:/var/sewasetu/uploads:ro

  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
